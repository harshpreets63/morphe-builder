enable-module-update = true
parallel-jobs = 1
patches-version = "dev"
cli-version = "latest"

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/elohim-etz/morphe-builder/blob/main/CONFIG.md for more detailed explanations

# you can use rvmm-config-gen to generate a config



[YouTube]
build-mode = "both"
enabled = true
included-patches = "'Custom branding icon for YouTube'"
patcher-args = """\
  -OappIcon=mmt \
  """
patches-source = "anddea/revanced-patches"
patches-version = "dev"
arch = "arm64-v8a"
rv-brand = "anddea ReVanced"
riplib = true  
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
direct-dlurl = "https://d.apkpure.com/b/APK/com.google.android.youtube?versionCode=1561063732"
